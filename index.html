<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthTube 약관 및 정책</title>
<link rel="stylesheet" href="./style.css">
<style>
  .docs { list-style: none; padding: 0; margin: 32px 0 0; }
  .docs li { margin-bottom: 12px; }
  .docs a {
    display: block; padding: 18px 20px; border: 1px solid var(--line);
    border-radius: 10px; text-decoration: none; color: var(--ink);
  }
  .docs a:hover { border-color: var(--accent); }
  .docs .t { font-weight: 600; font-size: 17px; }
  .docs .d { color: var(--ink-3); font-size: 14px; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <span class="brand">HealthTube</span>
  <h1>약관 및 정책</h1>
  <p class="meta">유튜브 운동 영상 링크를 부위별로 정리하고 메모와 함께 관리하는 앱</p>
</header>

<ul class="docs">
  <li>
    <a href="./privacy">
      <span class="t">개인정보처리방침</span>
      <span class="d">어떤 정보를 수집하고 어떻게 다루는지</span>
    </a>
  </li>
  <li>
    <a href="./terms">
      <span class="t">이용약관</span>
      <span class="d">서비스 이용 조건과 이용자·서비스의 책임 범위</span>
    </a>
  </li>
</ul>

<footer>
  이 페이지는 HealthTube 앱의 약관·정책 문서를 공개하기 위한 곳입니다.
</footer>

</div>
</body>
</html>
